[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyx-client"
version = "0.0.3"
description = "NYX Messenger — terminal-native, end-to-end encrypted messaging client"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "NYX Contributors" },
]
keywords = ["messaging", "e2ee", "encryption", "terminal", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "rich>=13.0.0",
    "cryptography>=41.0.0",
    "prompt_toolkit>=3.0.0",
    "requests>=2.28.0",
    "textual>=0.40.0",
    "plyer>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
nyx = "nyx_client.main:main"

[tool.setuptools]
packages = { find = { where = ["."], include = ["nyx_client*"] } }